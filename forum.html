<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fórum — SkyFit Speedrunning</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .forum-form { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; margin-bottom: 1.5rem; }
    .forum-form h3 { margin-bottom: 1rem; font-size: 1rem; }
    .forum-form input, .forum-form textarea {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.65rem 0.9rem; color: var(--text); font-size: 0.9rem;
      outline: none; margin-bottom: 0.7rem; font-family: inherit; resize: vertical;
      transition: border-color 0.2s;
    }
    .forum-form input:focus, .forum-form textarea:focus { border-color: var(--accent); }
    .btn-post {
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 0.6rem 1.2rem; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-post:hover { opacity: 0.85; }
    .msg-inline { font-size: 0.85rem; margin-left: 0.8rem; color: #f87171; }

    .post-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; margin-bottom: 1rem; }
    .post-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.6rem; }
    .post-titulo { font-weight: 600; font-size: 1rem; }
    .post-meta { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .post-conteudo { color: var(--muted); font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap; }
    .btn-delete {
      background: none; border: 1px solid #7f1d1d; color: #f87171; border-radius: 6px;
      padding: 4px 10px; font-size: 0.8rem; cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }
    .btn-delete:hover { background: #2d1515; }
    .empty-state { color: var(--muted); text-align: center; padding: 3rem; }
    .login-prompt { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; margin-bottom: 1.5rem; color: var(--muted); font-size: 0.9rem; }
    .login-prompt a { color: var(--accent2); text-decoration: none; }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo"><span>⚡</span><span>SkyFit Speedrunning</span></a>
  <div class="nav-links">
    <a href="index.html">Rankings</a>
    <a href="aparelhos.html">Aparelhos</a>
    <a href="forum.html" class="active">Fórum</a>
    <a href="https://discord.gg/DfZY2ct8Tx" target="_blank" class="discord-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.033.055a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
      Discord
    </a>
    <div id="nav-auth" style="display:flex;gap:0.5rem;align-items:center"></div>
  </div>
</nav>

<div class="hero" style="padding:3rem 2rem 2rem">
  <h1>Fórum</h1>
  <p>Discussões, dicas e novidades da comunidade</p>
</div>

<main>
  <div id="form-area"></div>
  <div class="section-title">💬 Posts</div>
  <div id="posts-lista"></div>
</main>

<footer>
  <p>© 2025 <strong>Super Fun Guy Studios</strong> & <strong>SkyFit Speedrunning</strong> — Todos os direitos reservados</p>
</footer>

<script src="auth.js"></script>
<script>
  renderNav();
  const sessao = getSessao();

  const formArea = document.getElementById("form-area");
  if (sessao) {
    formArea.innerHTML = `
      <div class="forum-form">
        <h3>Novo post</h3>
        <input type="text" id="titulo" placeholder="Título do post" maxlength="100">
        <textarea id="conteudo" rows="4" placeholder="Escreva aqui..."></textarea>
        <button class="btn-post" onclick="publicar()">Publicar</button>
        <span class="msg-inline" id="msg-post"></span>
      </div>
    `;
  } else {
    formArea.innerHTML = `<div class="login-prompt">Faça <a href="login.html">login</a> ou <a href="cadastro.html">cadastre-se</a> para criar posts.</div>`;
  }

  function publicar() {
    const titulo = document.getElementById("titulo").value;
    const conteudo = document.getElementById("conteudo").value;
    const msg = document.getElementById("msg-post");
    const res = criarPost(titulo, conteudo);
    if (!res.ok) { msg.textContent = res.msg; return; }
    document.getElementById("titulo").value = "";
    document.getElementById("conteudo").value = "";
    msg.textContent = "";
    renderPosts();
  }

  function renderPosts() {
    const lista = document.getElementById("posts-lista");
    const posts = getPosts();
    if (!posts.length) {
      lista.innerHTML = `<div class="empty-state">Nenhum post ainda. Seja o primeiro!</div>`;
      return;
    }
    lista.innerHTML = posts.map(p => {
      const podeDelete = sessao && (sessao.role === "mod" || sessao.id === p.autorId);
      const deleteBtn = podeDelete
        ? `<button class="btn-delete" onclick="removerPost('${p.id}')">🗑 Deletar</button>` : "";
      const data = new Date(p.criadoEm).toLocaleDateString("pt-BR");
      return `
        <div class="post-card">
          <div class="post-header">
            <div>
              <div class="post-titulo">${escapeHtml(p.titulo)}</div>
              <div class="post-meta">por ${escapeHtml(p.autor)} · ${data}</div>
            </div>
            ${deleteBtn}
          </div>
          <div class="post-conteudo">${escapeHtml(p.conteudo)}</div>
        </div>
      `;
    }).join("");
  }

  function removerPost(id) {
    if (!confirm("Deletar este post?")) return;
    deletarPost(id);
    renderPosts();
  }

  function escapeHtml(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  renderPosts();
</script>
</body>
</html>
