<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyFit Speedrunning</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .ranking-section { margin-bottom: 2.5rem; }
    .ranking-section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;
    }
    .ranking-section-title { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .btn-ver-mais {
      font-size: 0.8rem; color: var(--accent2); text-decoration: none;
      border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; transition: background 0.2s;
    }
    .btn-ver-mais:hover { background: var(--surface2); }

    /* Botão criar ranking */
    .btn-criar {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 0.6rem 1.2rem; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s; text-decoration: none;
    }
    .btn-criar:hover { opacity: 0.85; }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 500; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 1.8rem; width: 100%; max-width: 460px; margin: 1rem;
    }
    .modal h2 { font-size: 1.2rem; margin-bottom: 0.3rem; }
    .modal p { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.2rem; }
    .modal label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; margin-top: 0.8rem; }
    .modal input, .modal textarea {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.6rem 0.9rem; color: var(--text); font-size: 0.9rem;
      outline: none; font-family: inherit; transition: border-color 0.2s;
    }
    .modal input:focus, .modal textarea:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 0.6rem; margin-top: 1.2rem; justify-content: flex-end; }
    .btn-cancelar {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 0.6rem 1rem; cursor: pointer; font-size: 0.9rem;
    }
    .msg-modal { font-size: 0.85rem; margin-top: 0.8rem; padding: 0.5rem 0.8rem; border-radius: 8px; display: none; }
    .msg-modal.ok { background: #14532d; color: #4ade80; border: 1px solid #166534; display: block; }
    .msg-modal.erro { background: #2d1515; color: #f87171; border: 1px solid #7f1d1d; display: block; }

    .empty-lb { color: var(--muted); font-size: 0.9rem; padding: 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo"><span>⚡</span><span>SkyFit Speedrunning</span></a>
  <div class="nav-links">
    <a href="index.html" class="active">Rankings</a>
    <a href="https://discord.gg/DfZY2ct8Tx" target="_blank" class="discord-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.033.055a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
      </svg>
      Discord
    </a>
    <div id="nav-auth" style="display:flex;gap:0.5rem;align-items:center"></div>
  </div>
</nav>

<div class="hero">
  <h1>SkyFit Speedrunning</h1>
  <p>Rankings oficiais da comunidade de speedrun da academia SkyFit</p>
  <div style="max-width:480px;margin:0 auto 2rem;position:relative">
    <input id="pesquisa" type="text" placeholder="🔍 Pesquisar aparelho..." oninput="pesquisar(this.value)"
      style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.75rem 1rem;color:var(--text);font-size:1rem;outline:none;transition:border-color 0.2s"
      onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
    <div id="pesquisa-resultados" style="display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;z-index:200"></div>
  </div>
  <div class="hero-stats">
    <div class="stat-box">
      <div class="num" id="total-runs">—</div>
      <div class="label">Runs Aprovadas</div>
    </div>
    <div class="stat-box">
      <div class="num" id="total-aparelhos">—</div>
      <div class="label">Aparelhos/Atividades</div>
    </div>
    <div class="stat-box">
      <div class="num" id="total-runners">—</div>
      <div class="label">Runners Ativos</div>
    </div>
  </div>
</div>

<main>
  <div class="section-title">🏆 Rankings</div>
  <div id="rankings-container"></div>
</main>



<footer>
  <p>© 2025 <strong>Super Fun Guy Studios</strong> & <strong>SkyFit Speedrunning</strong> — Todos os direitos reservados</p>
  <p style="margin-top:6px"><a href="https://discord.gg/DfZY2ct8Tx" target="_blank">Discord da Comunidade</a></p>
</footer>

<script src="auth.js"></script>
<script src="script.js"></script>
<script>
  renderNav();

  function todosAparelhos() { return aparelhos; }

  function pesquisar(q) {
    const res = document.getElementById("pesquisa-resultados");
    if (!q.trim()) { res.style.display = "none"; return; }
    const filtrados = todosAparelhos().filter(a =>
      a.nome.toLowerCase().includes(q.toLowerCase()) ||
      a.categorias.some(c => c.toLowerCase().includes(q.toLowerCase()))
    );
    if (!filtrados.length) {
      res.innerHTML = `<div style="padding:0.8rem 1rem;color:var(--muted);font-size:0.9rem">Nenhum resultado.</div>`;
    } else {
      res.innerHTML = filtrados.map(a => `
        <a href="aparelhos/${a.id}.html" style="display:flex;align-items:center;gap:10px;padding:0.75rem 1rem;color:var(--text);text-decoration:none;border-bottom:1px solid var(--border)"
          onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background=''">
          <span style="font-size:1.4rem">${a.icon}</span>
          <div>
            <div style="font-weight:600;font-size:0.95rem">${a.nome}</div>
            <div style="font-size:0.75rem;color:var(--muted)">${a.categorias.join(" · ")}</div>
          </div>
        </a>
      `).join("");
    }
    res.style.display = "block";
  }

  document.addEventListener("click", e => {
    if (!e.target.closest("#pesquisa") && !e.target.closest("#pesquisa-resultados"))
      document.getElementById("pesquisa-resultados").style.display = "none";
  });

  function renderRankings() {
    const todos = todosAparelhos();
    const container = document.getElementById("rankings-container");
    if (!todos.length) {
      container.innerHTML = `<p style="color:var(--muted)">Nenhum ranking disponível ainda.</p>`;
      return;
    }
    container.innerHTML = todos.map(a => {
      const runs = getRankingAparelho(a.id);
      const top3 = runs.slice(0, 3);
      const verMais = runs.length > 3
        ? `<a href="aparelhos/${a.id}.html" class="btn-ver-mais">Ver todos (${runs.length})</a>` : "";
      return `
        <div class="ranking-section">
          <div class="ranking-section-header">
            <div class="ranking-section-title">${a.icon} ${a.nome}</div>
            <div style="display:flex;gap:0.5rem;align-items:center">
              ${verMais}
              <a href="aparelhos/${a.id}.html" class="btn-ver-mais">Submeter run →</a>
            </div>
          </div>
          ${buildLeaderboard(top3)}
        </div>
      `;
    }).join("");

    const todasRuns = todos.flatMap(a => getRankingAparelho(a.id));
    const runners = new Set(todasRuns.map(r => r.runner));
    document.getElementById("total-runs").textContent = todasRuns.length;
    document.getElementById("total-aparelhos").textContent = todos.length;
    document.getElementById("total-runners").textContent = runners.size;
  }

  renderRankings();
</script>
</body>
</html>
